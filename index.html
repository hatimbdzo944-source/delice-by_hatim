
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Délice | Site officiel</title>
  <meta name="author" content="Votre Nom">
  <meta name="description" content="Bienvenue chez Délice, découvrez notre restaurant.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #38251d;
      text-align: center;
    }
    header {
      background: #7b241c;
      color: white;
      padding: 24px 12px;
    }
    header h1 { margin: 0; font-size: 38px; }
    main { padding: 45px 18px; }
    .card {
      max-width: 500px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px #00000015;
    }
    button {
      background: #7b241c;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    footer {
      margin-top: 40px;
      padding: 20px;
      color: #765c50;
    }
  </style>
</head>
<body>
  <header>
    <h1>Délice</h1>
    <p>Bienvenue dans notre restaurant</p>
  </header>

  <main>
    <div class="card">
      <h2>Découvrez Délice</h2>
      <p>Bienvenue sur notre nouveau site web.</p>
      <button onclick="alert('Bienvenue chez Délice !')">
        Découvrir
      </button>
    </div>
  </main>

  <footer>
    Site créé par Votre Nom
  </footer>
</body>
</html>
